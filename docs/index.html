<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esfera dos Mistérios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;700&family=Spline+Sans+Mono&display=swap">
<style>
:root{--bg:#17130f;--panel:#211b15;--line:#5a4a37;--fg:#ece2d0;--muted:#a8987f;--accent:#e0a54a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Alegreya Sans","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.5;padding:40px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
main{max-width:720px;margin:0 auto;display:grid;gap:24px}
.eyebrow{font-family:"Spline Sans Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:"IM Fell English SC",Georgia,serif;font-weight:400;font-size:clamp(32px,6vw,48px);line-height:1.05;margin:0}
p{margin:0;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li a,li span{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);text-decoration:none;color:var(--fg)}
li a:hover,li a:focus-visible{border-color:var(--accent);outline:none}
li b{font-family:"IM Fell English SC",Georgia,serif;font-weight:400;font-size:20px}
li i{font-style:normal;font-family:"Spline Sans Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);align-self:center}
li span{opacity:.5}
</style>
</head>
<body>
<main>
  <div>
    <div class="eyebrow">Daggerheart · Ruptura</div>
    <h1>Esfera dos Mistérios</h1>
  </div>
  <p>Mapas clicáveis dos andares, com os encontros, as fichas das ameaças e os mapas sugeridos.</p>
  <ul>
    <li><a href="andar-3/"><b>Andar 3 — O Cofre que Mente</b><i>Folia · nível 3</i></a></li>
    <li><span><b>Andar 4 — A Galeria das Lembranças</b><i>em breve</i></span></li>
  </ul>
</main>
</body>
</html>
